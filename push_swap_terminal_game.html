
<style>
* { box-sizing: border-box; }
body { margin: 0; }
#app {
  background: #0e1117;
  color: #c9d1d9;
  font-family: var(--font-mono);
  padding: 1.25rem;
  border-radius: var(--border-radius-lg);
  min-height: 520px;
}
#top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.25rem;
}
#top-bar .title { font-size: 13px; color: #58a6ff; letter-spacing: 0.08em; }
#top-bar .meta { font-size: 13px; color: #8b949e; }
#top-bar .meta span { color: #e6edf3; font-weight: 500; }
#stacks-row {
  display: flex;
  gap: 2rem;
  justify-content: center;
  margin-bottom: 1.25rem;
}
.stack-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.stack-label { font-size: 12px; color: #8b949e; letter-spacing: 0.1em; margin-bottom: 2px; }
.stack-well {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-height: 240px;
  width: 170px;
  padding: 8px 8px 4px;
  border: 0.5px solid #30363d;
  border-radius: var(--border-radius-md);
  background: #161b22;
  justify-content: flex-start;
}
.empty-hint { font-size: 11px; color: #484f58; margin: auto; }
.bar {
  border-radius: 4px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 500;
  transition: width 0.15s ease, background 0.2s ease;
  color: #0e1117;
}
.bar.is-top { outline: 2px solid #58a6ff; outline-offset: 1px; }
.bar.is-sorted { background: #1D9E75 !important; color: #E1F5EE !important; }
#divider { border: none; border-top: 0.5px solid #21262d; margin: 0 0 1rem; }
#log-area {
  min-height: 48px;
  max-height: 48px;
  overflow: hidden;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-content: flex-start;
  margin-bottom: 1rem;
}
.log-chip {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: #21262d;
  color: #8b949e;
  border: 0.5px solid #30363d;
}
.log-chip.fresh { background: #0d2744; color: #58a6ff; border-color: #1f4b7a; }
.log-chip.err { background: #2d0f0f; color: #f85149; border-color: #5c1a1a; }
#terminal {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #161b22;
  border: 0.5px solid #30363d;
  border-radius: var(--border-radius-md);
  padding: 8px 12px;
  margin-bottom: 1rem;
}
#prompt { color: #3fb950; font-size: 14px; white-space: nowrap; }
#cmd-input {
  background: transparent;
  border: none;
  outline: none;
  color: #e6edf3;
  font-family: var(--font-mono);
  font-size: 14px;
  flex: 1;
  caret-color: #58a6ff;
}
#hint-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 1rem;
}
.hint-key {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  background: #21262d;
  color: #8b949e;
  border: 0.5px solid #30363d;
  cursor: pointer;
  transition: background 0.1s;
}
.hint-key:hover { background: #30363d; color: #c9d1d9; }
#ctrl-row {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.ctrl-btn {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 4px 12px;
  border-radius: var(--border-radius-md);
  border: 0.5px solid #30363d;
  background: transparent;
  color: #8b949e;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
}
.ctrl-btn:hover { background: #21262d; color: #e6edf3; }
#win-banner {
  display: none;
  text-align: center;
  font-size: 15px;
  font-weight: 500;
  color: #3fb950;
  padding: 0.6rem;
  background: #0d2816;
  border: 0.5px solid #1a4a2a;
  border-radius: var(--border-radius-md);
  margin-bottom: 1rem;
  letter-spacing: 0.05em;
}
#status-line { font-size: 12px; color: #8b949e; min-height: 18px; margin-bottom: 0.75rem; }
</style>

<div id="app">
  <h2 class="sr-only">push_swap terminal game — sort stack A using push_swap operations</h2>

  <div id="top-bar">
    <div class="title">push_swap</div>
    <div class="meta">ops: <span id="op-count">0</span></div>
  </div>

  <div id="win-banner"></div>
  <div id="status-line"></div>

  <div id="stacks-row">
    <div class="stack-col">
      <div class="stack-label">A</div>
      <div class="stack-well" id="well-a"></div>
    </div>
    <div class="stack-col">
      <div class="stack-label">B</div>
      <div class="stack-well" id="well-b"></div>
    </div>
  </div>

  <hr id="divider">

  <div id="log-area"></div>

  <div id="terminal">
    <span id="prompt">push_swap $&gt;</span>
    <input id="cmd-input" type="text" autocomplete="off" spellcheck="false" placeholder="type op + enter" aria-label="command input">
  </div>

  <div id="hint-row">
    <span class="hint-key" onclick="typeOp('sa')">sa</span>
    <span class="hint-key" onclick="typeOp('sb')">sb</span>
    <span class="hint-key" onclick="typeOp('ss')">ss</span>
    <span class="hint-key" onclick="typeOp('pa')">pa</span>
    <span class="hint-key" onclick="typeOp('pb')">pb</span>
    <span class="hint-key" onclick="typeOp('ra')">ra</span>
    <span class="hint-key" onclick="typeOp('rb')">rb</span>
    <span class="hint-key" onclick="typeOp('rr')">rr</span>
    <span class="hint-key" onclick="typeOp('rra')">rra</span>
    <span class="hint-key" onclick="typeOp('rrb')">rrb</span>
    <span class="hint-key" onclick="typeOp('rrr')">rrr</span>
    <span class="hint-key" onclick="undoOp()" style="margin-left:8px;">undo</span>
  </div>

  <div id="ctrl-row">
    <button class="ctrl-btn" onclick="newGame(5)">new 5</button>
    <button class="ctrl-btn" onclick="newGame(7)">new 7</button>
    <button class="ctrl-btn" onclick="newGame(10)">new 10</button>
  </div>
</div>

<script>
let A=[], B=[], opCount=0, history=[], won=false;
let audioCtx=null;

const BAR_COLORS = [
  ['#7F77DD','#EEEDFE'],
  ['#1D9E75','#E1F5EE'],
  ['#D85A30','#FAECE7'],
  ['#378ADD','#E6F1FB'],
  ['#BA7517','#FAEEDA'],
  ['#D4537E','#FBEAF0'],
  ['#639922','#EAF3DE'],
  ['#888780','#F1EFE8'],
];

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function beepError() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(180, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.18);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.18);
  } catch(e) {}
}

function beepOk() {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.07);
  } catch(e) {}
}

function beepWin() {
  try {
    const ctx = getAudio();
    [523,659,784,1047].forEach((f,i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = f;
      const t = ctx.currentTime + i * 0.12;
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      osc.start(t); osc.stop(t + 0.2);
    });
  } catch(e) {}
}

function isSorted(arr) {
  for (let i=1;i<arr.length;i++) if(arr[i-1]>arr[i]) return false;
  return true;
}

function newGame(n) {
  const vals = Array.from({length:n},(_,i)=>i+1);
  do {
    for(let i=vals.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [vals[i],vals[j]]=[vals[j],vals[i]];
    }
  } while(isSorted(vals));
  A=[...vals]; B=[]; opCount=0; history=[]; won=false;
  document.getElementById('win-banner').style.display='none';
  document.getElementById('log-area').innerHTML='';
  document.getElementById('op-count').textContent='0';
  setStatus('');
  render();
  focusInput();
}

function barColor(val, total) {
  const idx = (val-1) % BAR_COLORS.length;
  return BAR_COLORS[idx];
}

function barWidth(val, total) {
  return Math.round(28 + (val/total)*120);
}

function renderWell(id, stack, total, allSorted) {
  const well = document.getElementById(id);
  well.innerHTML='';
  if(stack.length===0){
    const h=document.createElement('div');
    h.className='empty-hint'; h.textContent='empty';
    well.appendChild(h); return;
  }
  stack.forEach((val,idx) => {
    const bar=document.createElement('div');
    const sorted = allSorted && id==='well-a';
    bar.className='bar'+(idx===0?' is-top':'')+(sorted?' is-sorted':'');
    if(!sorted){
      const [bg,fg]=barColor(val,total);
      bar.style.background=bg; bar.style.color=fg;
    }
    bar.style.width=barWidth(val,total)+'px';
    bar.textContent=val;
    well.appendChild(bar);
  });
}

function render() {
  const total=A.length+B.length;
  const sorted=B.length===0&&A.length>0&&isSorted(A);
  renderWell('well-a',A,total,sorted);
  renderWell('well-b',B,total,false);
  document.getElementById('op-count').textContent=opCount;
  if(sorted&&!won){
    won=true;
    const b=document.getElementById('win-banner');
    b.style.display='block';
    b.textContent='sorted in '+opCount+' operation'+(opCount===1?'':'s');
    beepWin();
  }
}

function setStatus(msg, isErr) {
  const el=document.getElementById('status-line');
  el.textContent=msg;
  el.style.color=isErr?'#f85149':'#8b949e';
}

function addLog(op, isErr) {
  const area=document.getElementById('log-area');
  const old=area.querySelector('.fresh');
  if(old) old.classList.remove('fresh');
  const chip=document.createElement('span');
  chip.className='log-chip'+(isErr?' err':' fresh');
  chip.textContent=op;
  area.appendChild(chip);
  area.scrollTop=area.scrollHeight;
}

function execOp(op) {
  if(won) return;
  const snap={A:[...A],B:[...B]};
  let ok=true, msg='';

  if(op==='sa'){if(A.length>=2){[A[0],A[1]]=[A[1],A[0]];}else{ok=false;msg='sa: need ≥2 in A';}}
  else if(op==='sb'){if(B.length>=2){[B[0],B[1]]=[B[1],B[0]];}else{ok=false;msg='sb: need ≥2 in B';}}
  else if(op==='ss'){
    if(A.length>=2)[A[0],A[1]]=[A[1],A[0]];
    if(B.length>=2)[B[0],B[1]]=[B[1],B[0]];
  }
  else if(op==='pa'){if(B.length>0){A.unshift(B.shift());}else{ok=false;msg='pa: B is empty';}}
  else if(op==='pb'){if(A.length>0){B.unshift(A.shift());}else{ok=false;msg='pb: A is empty';}}
  else if(op==='ra'){if(A.length>1){A.push(A.shift());}else{ok=false;msg='ra: need ≥2 in A';}}
  else if(op==='rb'){if(B.length>1){B.push(B.shift());}else{ok=false;msg='rb: need ≥2 in B';}}
  else if(op==='rr'){
    if(A.length>1)A.push(A.shift());
    if(B.length>1)B.push(B.shift());
  }
  else if(op==='rra'){if(A.length>1){A.unshift(A.pop());}else{ok=false;msg='rra: need ≥2 in A';}}
  else if(op==='rrb'){if(B.length>1){B.unshift(B.pop());}else{ok=false;msg='rrb: need ≥2 in B';}}
  else if(op==='rrr'){
    if(A.length>1)A.unshift(A.pop());
    if(B.length>1)B.unshift(B.pop());
  }
  else { ok=false; msg='unknown op: '+op; }

  if(!ok){ beepError(); addLog(op,true); setStatus(msg,true); return; }
  history.push(snap);
  opCount++;
  beepOk();
  addLog(op,false);
  setStatus('');
  render();
}

function undoOp() {
  if(history.length===0){beepError();setStatus('nothing to undo',true);return;}
  const snap=history.pop();
  A=snap.A; B=snap.B; opCount--;
  won=false;
  document.getElementById('win-banner').style.display='none';
  const chips=document.getElementById('log-area').querySelectorAll('.log-chip');
  if(chips.length>0) chips[chips.length-1].remove();
  setStatus('');
  render();
  focusInput();
}

function typeOp(op) {
  const inp=document.getElementById('cmd-input');
  inp.value=op;
  inp.focus();
  submitInput();
}

function submitInput() {
  const inp=document.getElementById('cmd-input');
  const val=inp.value.trim().toLowerCase();
  inp.value='';
  if(!val) return;
  if(val==='undo'){undoOp();return;}
  if(val.startsWith('new ')){
    const n=parseInt(val.split(' ')[1]);
    if(n>=3&&n<=15){newGame(n);return;}
  }
  execOp(val);
}

function focusInput() {
  document.getElementById('cmd-input').focus();
}

document.getElementById('cmd-input').addEventListener('keydown', e => {
  if(e.key==='Enter'){ e.preventDefault(); submitInput(); }
  if(e.key==='ArrowUp'){
    e.preventDefault();
    const chips=document.getElementById('log-area').querySelectorAll('.log-chip:not(.err)');
    if(chips.length>0){
      document.getElementById('cmd-input').value=chips[chips.length-1].textContent;
    }
  }
});

document.getElementById('app').addEventListener('click', focusInput);

newGame(5);
</script>
